---
name: Build and publish a 🛢️ container

on:
  push:
    branches:
      - 'main'
    tags:
      - '*'
  schedule:
    - cron: "0 8,16 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push-container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Source checkout
        uses: actions/checkout@v6

      - name: Build Vox Pupuli renovate container
        uses: voxpupuli/gha-build-and-publish-a-container@v2
        with:
          registry_password: ${{ secrets.GITHUB_TOKEN }}
          build_arch: linux/amd64,linux/arm64
          buildfile: Containerfile
          docker_username: voxpupulibot
          docker_password: ${{ secrets.DOCKERHUB_BOT_ADMIN_TOKEN }}
          tags: |
            ghcr.io/voxpupuli/renovate:latest
            docker.io/voxpupuli/renovate:latest

      - name: Update Docker Hub Description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: voxpupulibot
          password: ${{ secrets.DOCKERHUB_BOT_ADMIN_TOKEN }}
          repository: voxpupuli/renovate
