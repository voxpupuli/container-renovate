---
# Managed by modulesync - DO NOT EDIT
# https://voxpupuli.org/docs/updating-files-managed-with-modulesync/

name: 📦 Build and Publish

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
    tags:
      - '*'
  schedule:
    - cron: '0 8,16 * * *'
  workflow_dispatch:

concurrency:
  group: build-and-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  setup-matrix:
    name: Set up build matrix
    runs-on: ubuntu-latest
    outputs:
      build-matrix: ${{ steps.build-matrix.outputs.build-matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate build matrix
        id: build-matrix
        run: |
          matrix_json=$(jq -cn '{include: [{platform: "amd64", runner: "ubuntu-24.04"}, {platform: "arm64", runner: "ubuntu-24.04-arm"}]}')
          echo "build-matrix=$matrix_json" >> "$GITHUB_OUTPUT"

  build-and-push-container:
    name: Build and publish container
    runs-on: ${{ matrix.runner }}
    needs:
      - setup-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup-matrix.outputs.build-matrix) }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and publish container
        id: build
        uses: voxpupuli/gha-build-and-publish-a-container@f1680271a3fd34267c1401c760a15f45a9cf34ca # v2.0.0
        with:
          registry_password: ${{ secrets.GITHUB_TOKEN }}
          build_arch: linux/${{ matrix.platform }}
          build_context: .
          buildfile: Containerfile
          tags: |
            ghcr.io/${{ github.repository_owner }}/renovate:${{ github.sha }}-${{ matrix.platform }}

  create-multiarch-manifests:
    name: Create multi-architecture manifests
    runs-on: ubuntu-latest
    needs:
      - setup-matrix
      - build-and-push-container
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: voxpupulibot
          password: ${{ secrets.DOCKERHUB_BOT_ADMIN_TOKEN }}

      - name: Create multi-architecture manifests
        run: |
          docker buildx imagetools create -t ghcr.io/${{ github.repository_owner }}/renovate:latest -t docker.io/${{ github.repository_owner }}/renovate:latest ghcr.io/${{ github.repository_owner }}/renovate:${{ github.sha }}-arm64 ghcr.io/${{ github.repository_owner }}/renovate:${{ github.sha }}-amd64

  scan-published-container:
    name: Scan published container
    runs-on: ubuntu-latest
    needs:
      - create-multiarch-manifests
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan image with Anchore Grype
        id: grype
        continue-on-error: true
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: 'ghcr.io/${{ github.repository_owner }}/renovate:latest'
          fail-build: false
          output-format: table
          output-file: grype-report.txt

      - name: Scan image with Trivy
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_TABLE_MODE: detailed
        with:
          image-ref: 'ghcr.io/${{ github.repository_owner }}/renovate:latest'
          scanners: vuln
          severity: HIGH,CRITICAL,MEDIUM,LOW
          format: table
          output: trivy-report.txt
          exit-code: '0'

      - name: Upload Grype report
        id: grype-report
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grype-report
          path: grype-report.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Trivy report
        id: trivy-report
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-report
          path: trivy-report.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Create or update vulnerability issue
        if: ${{ always() }}
        run: ruby .github/scripts/update_vulnerability_issue.rb
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IMAGE: 'ghcr.io/${{ github.repository_owner }}/renovate:latest'
          GRYPE_OUTCOME: ${{ steps.grype.outcome }}
          TRIVY_OUTCOME: ${{ steps.trivy.outcome }}
          GRYPE_REPORT_URL: ${{ steps.grype-report.outputs.artifact-url }}
          TRIVY_REPORT_URL: ${{ steps.trivy-report.outputs.artifact-url }}

  update-dockerhub-description:
    name: Update Docker Hub description
    runs-on: ubuntu-latest
    needs:
      - create-multiarch-manifests
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: voxpupulibot
          password: ${{ secrets.DOCKERHUB_BOT_ADMIN_TOKEN }}
          repository: voxpupuli/renovate
